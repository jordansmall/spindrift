name: Agent dispatch

# Adding the `agent-trigger` label to an issue fires one dogfood run against it:
# claim the issue (swap `agent-trigger` -> `agent-in-progress` up front), build
# the image, then drain that single issue (open PR, poll checks, rebase-merge on
# green). The claim clears `agent-trigger` before any build work, so the label
# self-clears and will not re-fire.
#
# This is the Forgejo Actions mirror of .github/workflows/agent-dispatch.yml
# (issue #1967). Forgejo has no GitHub App model, so there is no worker-App
# mint and no gh-token-refresher to port: the job authenticates with a single,
# non-expiring `FORGEJO_TOKEN` repository secret (ADR 0038). Codeberg's shared
# runners cannot build the agent image, so this workflow targets a registered
# self-hosted runner (the `self-hosted` label) — see docs/reference.md,
# "Forgejo Actions dispatch templates".
on:
  issues:
    types: [labeled]

# Serialise per issue only: two labelings of the SAME issue queue behind each
# other (no double-dispatch), but different issues run concurrently. Agent boxes
# share one Claude rate-limit window — with repo-wide serialisation removed, the
# operator is responsible for not triggering more issues than that window allows.
concurrency:
  group: agent-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event.label.name == 'agent-trigger'
    runs-on: self-hosted
    timeout-minutes: 180
    env:
      # Select the forgejo backend on both axes; the launcher reads these from
      # the environment. FORGEJO_BASE_URL falls back to Codeberg when the repo
      # variable is unset (ADR 0038).
      ISSUE_TRACKER: forgejo
      CODE_FORGE: forgejo
      FORGEJO_BASE_URL: ${{ vars.FORGEJO_BASE_URL || 'https://codeberg.org' }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
    steps:
      # Checkout must precede the local composite steps below: Forgejo resolves
      # ./.github/actions/* from the checked-out tree.
      - uses: actions/checkout@v4

      # Claim up front (agent-trigger -> agent-in-progress) so ownership is
      # atomic before the ~2m40s build. The GitHub workflow does this inside
      # agent-setup via `gh issue edit`, but `gh` targets api.github.com and a
      # Forgejo token cannot authenticate there, so the claim runs through the
      # forgejo-label-swap composite (Forgejo REST) instead — hence it precedes
      # agent-setup here rather than living inside it. Strip every other
      # lifecycle label, not just the trigger and ready-for-agent: a re-triggered
      # issue may still carry a stale terminal label (agent-complete /
      # agent-failed) or a leftover agent-recover, and the claim must land it
      # cleanly on agent-in-progress regardless of what it was wearing before.
      - name: Claim the issue
        uses: ./.github/actions/forgejo-label-swap
        with:
          base-url: ${{ env.FORGEJO_BASE_URL }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.issue.number }}
          add-labels: agent-in-progress
          remove-labels: agent-trigger ready-for-agent agent-recover agent-complete agent-failed

      # Install Nix and build — plus the plumbing env (RUNTIME + tokens) written
      # to the job env and the bot identity surfaced as step outputs for the
      # dispatch flags below. `forge: forgejo` skips agent-setup's GitHub-only
      # rate-limit smoke and `gh` claim (that claim ran above). Auth is the
      # single `FORGEJO_TOKEN` repository secret: Forgejo has no App-installation
      # token to mint and its PATs do not expire, so neither the App mint nor the
      # gh-token-refresher the GitHub workflow carries has any analog here (ADR
      # 0038).
      - name: Agent setup
        id: setup
        uses: ./.github/actions/agent-setup
        with:
          forge: forgejo
          gh-token: ${{ secrets.FORGEJO_TOKEN }}
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          repo: ${{ github.repository }}
          git-user-name: ${{ vars.AGENT_GIT_USER_NAME }}
          git-user-email: ${{ vars.AGENT_GIT_USER_EMAIL }}

      # The claim step (inside agent-setup) already swapped the issue onto
      # agent-in-progress, so --issue-number targets it by number rather than a
      # label query; --label still names the in-progress label so dispatchWave
      # skips the redundant re-claim of an already-claimed issue.
      - name: Dispatch the labeled issue
        run: |
          nix run . -- dispatch \
            --box-forge-and-issue-access read-write \
            --issue-number "${{ github.event.issue.number }}" \
            --label agent-in-progress \
            --max-jobs 1 \
            --repo-slug "${{ github.repository }}" \
            --base-branch "${{ github.event.repository.default_branch }}" \
            --git-user-name "${{ steps.setup.outputs.git-user-name }}" \
            --git-user-email "${{ steps.setup.outputs.git-user-email }}"

      # The launcher parses the two blocker formats and, when this claimed issue
      # is blocked by an unmet dependency, drops logs/blocked.txt naming the
      # blockers instead of working it. Detect that marker, then undo the
      # up-front claim (back to ready-for-agent) and say why. No recovery — the
      # operator re-triggers once the blocker resolves. always() so a failed
      # build (no marker) is a no-op. The label swap runs through the
      # forgejo-label-swap composite (Forgejo REST); `fj` has no label verb and
      # is not guaranteed on the runner.
      - name: Detect a blocked marker
        id: blocked
        if: always()
        run: |
          if [ -f logs/blocked.txt ]; then
            {
              echo "blocked=true"
              echo "blockers<<EOF"
              cat logs/blocked.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release the claim if blocked
        if: always() && steps.blocked.outputs.blocked == 'true'
        uses: ./.github/actions/forgejo-label-swap
        with:
          base-url: ${{ env.FORGEJO_BASE_URL }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.issue.number }}
          add-labels: ready-for-agent
          remove-labels: agent-in-progress
          comment: >-
            🚧 Agent made no changes: this issue is blocked by
            ${{ steps.blocked.outputs.blockers }} (not yet `agent-complete` or
            closed). Released back to `ready-for-agent`; re-trigger once the
            blocker is resolved.

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ github.event.issue.number }}
          path: logs/
          if-no-files-found: ignore
