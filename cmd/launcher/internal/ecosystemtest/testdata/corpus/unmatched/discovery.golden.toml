# Registry routes file (ADR 0045). Generated by spindrift registry discover.
# Some routes below use a placeholder env credential -- set the named
# environment variable, or edit the route, before relying on it.

[[routes]]
match-host = "one.example.test"
auth-scheme = "bearer"
credential = { env = "SPINDRIFT_REGISTRY_CREDENTIAL_ONE_EXAMPLE_TEST" }

[[routes]]
match-host = "two-mirror.example.test"
upstream-origin = "http://two-mirror.example.test:8080"
auth-scheme = "bearer"
credential = { env = "SPINDRIFT_REGISTRY_CREDENTIAL_TWO_MIRROR_EXAMPLE_TEST" }
