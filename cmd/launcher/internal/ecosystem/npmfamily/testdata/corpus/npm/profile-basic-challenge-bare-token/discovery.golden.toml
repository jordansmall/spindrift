# Registry routes file (ADR 0045). Generated by spindrift registry discover.

[[routes]]
# host profile "artifactory": JFrog Artifactory; a challenge the probe receives wins over the bearer default, and basic pairs the username below with the token as password
# basic username: the Artifactory username (or email) that owns the token
# credential helper: an access token from the JFrog Platform UI or `jf rt access-token-create`
match-host = "artifacts.corp.test"
# basic needs a user:secret credential, but the matched store yields a bare token, so host profile "artifactory"'s bare-token scheme replaces it
auth-scheme = "bearer"
credential = { npmrc = "stores/npmrc" }
