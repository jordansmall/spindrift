# Registry routes file (ADR 0045). Generated by spindrift registry discover.

[[routes]]
# host profile "artifactory": JFrog Artifactory; a challenge the probe receives wins over the bearer default, except that a basic challenge on a store-matched route keeps bearer (access tokens work as Bearer), and a basic route needs a user:secret credential whose user is the username below
# basic username: the Artifactory username (or email) that owns the token
# credential helper: an access token from the JFrog Platform UI or `jf rt access-token-create`
match-host = "artifacts.corp.test"
# auth-scheme from host profile "artifactory": the probe saw no usable challenge
auth-scheme = "bearer"
credential = { npmrc = "stores/npmrc" }
