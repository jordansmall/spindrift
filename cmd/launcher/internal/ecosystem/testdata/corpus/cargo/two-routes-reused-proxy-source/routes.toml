[[routes]]
match-host = "crates.acme.test"
upstream-origin = "https://crates.acme.test"
auth-scheme = "bearer"
credential = { env = "CARGO_TOKEN" }

[routes.ecosystems.cargo]
registries = ["private"]

[[routes]]
match-host = "other.acme.test"
upstream-origin = "https://other.acme.test"
auth-scheme = "bearer"
credential = { env = "CARGO_OTHER_TOKEN" }

[routes.ecosystems.cargo]
registries = ["other-private"]
