name: GH token refresher
description: >-
  Starts a background loop that re-mints a fresh GitHub App installation
  token every 45 minutes for the rest of the job and writes it to a file,
  exporting GH_TOKEN_REFRESH_FILE so the launcher (via its
  --gh-token-refresh-file flag) can poll the file and keep GH_TOKEN current
  past the ~1h installation-token lifetime (issue #1027). The App private
  key lives only in this backgrounded process's memory and a runner-temp
  file removed when the job ends — it never reaches the launcher process
  or the Box. The actual mint recipe lives in
  cmd/launcher/internal/ghapptoken/mint-token.sh, the single source of truth
  shared with local dispatch's Mint() (issue #2867) — this action just calls
  it in a loop rather than reimplementing it.

inputs:
  app-id:
    description: GitHub App ID (numeric)
    required: true
  private-key:
    description: GitHub App private key (PEM)
    required: true
  installation-id:
    description: >-
      Installation ID to mint tokens for (actions/create-github-app-token's
      installation-id output)
    required: true
  initial-token:
    description: >-
      The token already minted for this job's first hour — written as the
      refresh file's starting value so a launcher reading it before the
      first re-mint still sees a valid token.
    required: true

runs:
  using: composite
  steps:
    - name: Start GH token refresher
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.private-key }}
        INSTALLATION_ID: ${{ inputs.installation-id }}
        INITIAL_TOKEN: ${{ inputs.initial-token }}
      run: |
        # Private key and minted tokens are secrets; keep them off-limits to
        # any other account that can read $RUNNER_TEMP on a shared runner.
        umask 077

        token_file="$RUNNER_TEMP/gh-token-refresh"
        printf '%s' "$INITIAL_TOKEN" > "$token_file"
        echo "GH_TOKEN_REFRESH_FILE=$token_file" >> "$GITHUB_ENV"

        key_file="$RUNNER_TEMP/gh-app-private-key.pem"
        printf '%s\n' "$APP_PRIVATE_KEY" > "$key_file"

        # Checked once, up front, so a missing/non-executable script fails
        # this step loudly right now instead of surfacing 45 minutes later as
        # a silently-logged mint failure inside the backgrounded loop below —
        # exactly the stale-GH_TOKEN-until-401-at-merge failure mode #1027
        # exists to prevent.
        mint_script="$GITHUB_WORKSPACE/cmd/launcher/internal/ghapptoken/mint-token.sh"
        if [ ! -x "$mint_script" ]; then
          echo "gh-token-refresher: $mint_script missing or not executable" >&2
          exit 1
        fi

        # Re-mints via the App's own installation-token endpoint (the same
        # one actions/create-github-app-token calls) rather than that
        # action, since a composite action step can't be re-invoked from
        # inside a background loop. The JWT-build-and-exchange recipe itself
        # lives in cmd/launcher/internal/ghapptoken/mint-token.sh — the same
        # script local dispatch's Mint() invokes (issue #2867) — so it's
        # defined exactly once rather than duplicated here.
        mint_token() {
          token=$(GH_APP_ID="$APP_ID" GH_APP_PRIVATE_KEY_FILE="$key_file" GH_APP_INSTALLATION_ID="$INSTALLATION_ID" \
            "$mint_script")
          printf '%s' "$token" > "$token_file.tmp"
          mv "$token_file.tmp" "$token_file"
        }

        # Backgrounded past this step's own lifetime: stdin/stdout/stderr are
        # redirected away from the step's pipes (an inherited open fd would
        # otherwise hang the step waiting for this loop to exit), and disown
        # detaches it from the shell that's about to return. A single failed
        # mint (network blip, transient API error) logs and retries in 5m
        # rather than waiting out the full 45m cycle — the gap between a
        # failure and the next attempt must stay well inside the ~1h token
        # lifetime it's protecting. `mint_token || …` keeps that failure
        # from tripping this script's errexit (GitHub Actions runs `run:`
        # under `set -e -o pipefail`).
        (
          trap 'rm -f "$key_file"' EXIT
          sleep_secs=2700 # 45m: comfortably inside the ~1h installation-token lifetime
          while true; do
            sleep "$sleep_secs"
            if mint_token; then
              sleep_secs=2700
            else
              echo "gh-token-refresher: mint attempt failed, retrying in 5m" >&2
              sleep_secs=300
            fi
          done
        ) < /dev/null > "$RUNNER_TEMP/gh-token-refresher.log" 2>&1 &
        disown
