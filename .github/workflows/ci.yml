name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # cache-nix-action's purge deletes superseded nix store caches on main.
  actions: write

jobs:
  # Classifies the PR diff as `docs` or `code` (issue #5155). The heavy jobs
  # skip on `docs` here, inside the workflow, never via `paths-ignore`: a
  # commit with no checks reads rollup state NONE, which the launcher's CI
  # watcher waits out until its deadline, so a docs-only agent PR would never
  # land. Pushes to main always run the full matrix, which also keeps main's
  # nix store cache whole.
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A PR is judged by its base's CI scripts, never its own: they sit
      # outside .github/workflows/, so a token that can't edit this workflow
      # could otherwise rewrite the verdict. The PR's copy stands in only
      # while the base has none, i.e. on the PR that adds the script. Kept
      # inline (here and in ci-ok) because a composite action under
      # .github/actions/ would be PR-editable too.
      - name: Use the base branch's CI scripts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Never a shallow fetch here: a shallow base has no parents, so the
          # BASE...HEAD diff below finds no merge base once main moves on.
          git fetch origin "$BASE_SHA"
          for f in ci-changes.sh ci-ok.sh ci-go-tokens.go ci-comment-readers; do
            if git cat-file -e "$BASE_SHA:.github/scripts/$f" 2>/dev/null; then
              git show "$BASE_SHA:.github/scripts/$f" >".github/scripts/$f"
            fi
          done

      # The classifier parses a modified .go or .nix file to tell a
      # comment-only edit from a code one (issue #5158); without the tool
      # it falls to `code`, so each is installed only when the diff needs it.
      - name: Diff against the PR base
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-status -M "$BASE_SHA...$HEAD_SHA" >"$RUNNER_TEMP/diff"
          echo "merge-base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")" >>"$GITHUB_OUTPUT"
          for ext in go nix; do
            if grep -qE "^M"$'\t'".*\.$ext\$" "$RUNNER_TEMP/diff"; then
              echo "$ext=true" >>"$GITHUB_OUTPUT"
            fi
          done

      - name: Install Go
        if: steps.diff.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install Nix
        if: steps.diff.outputs.nix == 'true'
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Classify the diff against the PR base
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          MERGE_BASE: ${{ steps.diff.outputs.merge-base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            kind=$(bash .github/scripts/ci-changes.sh "$MERGE_BASE" "$HEAD_SHA" <"$RUNNER_TEMP/diff")
          else
            kind=code
          fi
          echo "kind=$kind" >>"$GITHUB_OUTPUT"
          echo "change kind: $kind"

  check:
    name: flake check + image realize (${{ matrix.nix-system }})
    needs: changes
    if: needs.changes.outputs.kind == 'code'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            nix-system: x86_64-linux
          - runner: ubuntu-24.04-arm
            nix-system: aarch64-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      # Fork-friendly binary cache: /nix rides the GitHub Actions cache, so no
      # external service or credentials. PRs (including from forks) restore
      # from base/default-branch caches; a miss degrades to a cold build.
      # Key on nix-system, not runner.os: both matrix arches are Linux but
      # hold arch-incompatible store paths, so a shared key would let them
      # evict each other.
      # Only main saves: PR-scoped saves are unreadable by other PRs yet push
      # the repo past GitHub's 10 GB cap, LRU-evicting the main caches every
      # PR restores from (one arch then builds cold).
      # Keyed per commit: an entry is immutable and a primary-key hit skips
      # the save, so a content-hash key froze main's store at the first commit
      # to reach each hash. The purge keeps only the newest entry per system
      # under the 10 GB cap.
      - name: Restore and save the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.nix-system }}-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ matrix.nix-system }}-
          gc-max-store-size-linux: 5G
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ matrix.nix-system }}-
          purge-created: 0
          purge-primary-key: never

      # shellcheck, the bats suite, and the eval-only equivalence checks.
      # The x86_64 leg also records eval stats for the report below; Nix
      # reads any NIX_SHOW_STATS but "0" as on, so the other leg sets "0".
      - name: nix flake check
        env:
          NIX_SHOW_STATS: ${{ matrix.nix-system == 'x86_64-linux' && '1' || '0' }}
          NIX_SHOW_STATS_PATH: ${{ runner.temp }}/eval-stats.json
        run: nix flake check --print-build-logs

      # Eval cost is reviewed, never gated (issue #5863): the report can't
      # change the job's conclusion. A PR compares against the latest
      # successful main run's artifact; a run that went red uploads nothing
      # worth comparing to.
      - name: Report eval stats
        if: ${{ !cancelled() && matrix.nix-system == 'x86_64-linux' }}
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash .github/scripts/eval-probe.sh >"$RUNNER_TEMP/eval-probe.json" || true
          args=("$RUNNER_TEMP/eval-stats.json" "$RUNNER_TEMP/eval-probe.json")
          base=$RUNNER_TEMP/eval-baseline
          if [ "$EVENT" = pull_request ] &&
            read -r run_id base_sha < <(gh run list --workflow ci.yml --branch main --event push \
              --status success --limit 1 --json databaseId,headSha \
              --jq '.[] | "\(.databaseId) \(.headSha)"') &&
            gh run download "$run_id" --name eval-stats --dir "$base"; then
            args+=("$base/eval-stats.json" "$base/eval-probe.json" "$base_sha")
          fi
          bash .github/scripts/eval-stats-render.sh "${args[@]}" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the eval stats baseline
        if: ${{ !cancelled() && matrix.nix-system == 'x86_64-linux' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: eval-stats
          path: |
            ${{ runner.temp }}/eval-stats.json
            ${{ runner.temp }}/eval-probe.json
          if-no-files-found: warn

      # Realize the Linux OCI image natively — the one thing the checks only
      # assert at eval time. Both matrix arches build their own image on a
      # native runner, so no cross-compile or podman fallback.
      - name: Build the agent image
        run: nix build .#packages.${{ matrix.nix-system }}.agent-image --print-build-logs

      # Ubuntu 24.04's AppArmor policy denies capabilities inside an
      # unprivileged user namespace, so bwrap and pasta both die writing
      # uid_map and every bwrap integration test below skipped.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Enforcement tests (issue #576): launch a real bwrap/OCI sandbox and
      # assert isolation holds from inside it, not just that the flags land on
      # argv. Gated behind the `integration` build tag. The tests self-skip
      # when no real runtime is usable, which suits a dev host or nested Box;
      # SPINDRIFT_REQUIRE_BWRAP turns the bwrap/pasta skips into failures here
      # so a runner that loses user namespaces goes red, not quietly green.
      #
      # Also covers the devShell-wrap PATH invariant (issue #798): a real
      # `nix develop` devShell naming neither git nor gh still leaves both
      # reachable to the wrapped command.
      - name: Runner sandbox integration tests
        env:
          SPINDRIFT_REQUIRE_BWRAP: "1"
        run: nix develop -c bash -c 'cd cmd/launcher && go test -tags=integration -v ./internal/runner/... ./driver-exec/...'

      # `nix flake check` registers no GC roots, so the pre-save
      # `gc-max-store-size` collection deleted every check output and each PR
      # rebuilt every check. Out-links under RUNNER_TEMP outlive the post-job
      # save. Every output is already built, so this only evaluates.
      - name: Root the check outputs for the cache save
        if: github.ref == 'refs/heads/main'
        run: |
          nix eval --raw .#checks.${{ matrix.nix-system }} \
            --apply 'cs: builtins.concatStringsSep "\n" (map (n: ".#checks.${{ matrix.nix-system }}.${n}") (builtins.attrNames cs))' \
            | nix build --stdin --out-link "$RUNNER_TEMP/check-roots/check"

  # spindrift's product is a Linux OCI box, so the image build and the
  # bwrap/OCI integration tests above are Linux-only and stay on the job
  # above. This job guards the other axis: the developer/consumer surface on
  # Apple Silicon (aarch64-darwin, a flake.nix system). It runs in parallel
  # with `check` — no `needs:` between them.
  check-macos:
    name: flake check (aarch64-darwin)
    needs: changes
    if: needs.changes.outputs.kind == 'code'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      # Separate cache from the Linux job: primary-key already keys on
      # runner.os, so macOS and Linux never share or evict each other. Only
      # main saves, and keys/purges per commit, for the same reasons as the
      # Linux job.
      - name: Restore and save the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-macos: 5G
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # On aarch64-darwin the OCI-image checks self-skip (the image module is
      # optionalAttrs-gated to Linux in nix/checks/default.nix), so this runs
      # the source-level checks — go test/vet/fmt, shellcheck, the bats suite
      # (driven through fakes, no real image), schema/equivalence/prompt eval —
      # natively. The launcher commands and skillsDir build from hostPkgs
      # (lib/mkHarness.nix), so no Linux builder is required.
      - name: nix flake check
        run: nix flake check --print-build-logs

      # Realize the consumer-facing CLI natively on Apple Silicon — the one
      # package a Mac consumer actually runs.
      - name: Build the spindrift CLI
        run: nix build .#packages.aarch64-darwin.spindrift --print-build-logs

      # Same reason as the Linux job's step.
      - name: Root the check outputs for the cache save
        if: github.ref == 'refs/heads/main'
        run: |
          nix eval --raw .#checks.aarch64-darwin \
            --apply 'cs: builtins.concatStringsSep "\n" (map (n: ".#checks.aarch64-darwin.${n}") (builtins.attrNames cs))' \
            | nix build --stdin --out-link "$RUNNER_TEMP/check-roots/check"

  # The docs-only lane (issue #5155): one Linux runner building the checks
  # that read docs files, in place of the matrix above. aarch64 because its
  # runner finishes the same work faster than the x86_64 one.
  docs:
    name: docs checks (aarch64-linux)
    needs: changes
    if: needs.changes.outputs.kind == 'docs'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-aarch64-linux-${{ github.sha }}
          restore-prefixes-first-match: nix-aarch64-linux-
          save: false

      - name: Build the docs checks
        run: nix build .#packages.aarch64-linux.checks-docs --print-build-logs

  # The single required status check (issue #5155): branch protection names
  # this job alone, so it runs whatever the change kind and passes only when
  # the lane that kind requires succeeded and nothing failed or was cancelled.
  ci-ok:
    name: ci-ok
    needs: [changes, check, check-macos, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same reason and body as the step in `changes`, but shallow: this job
      # reads two blobs and diffs nothing.
      - name: Use the base branch's CI scripts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          for f in ci-changes.sh ci-ok.sh; do
            if git cat-file -e "$BASE_SHA:.github/scripts/$f" 2>/dev/null; then
              git show "$BASE_SHA:.github/scripts/$f" >".github/scripts/$f"
            fi
          done

      - name: Require the change kind's lane to have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          KIND: ${{ needs.changes.outputs.kind }}
        run: |
          if [ "$KIND" = docs ]; then
            required=(changes docs)
          else
            required=(changes check check-macos)
          fi
          bash .github/scripts/ci-ok.sh "${required[@]}" <<<"$NEEDS"
